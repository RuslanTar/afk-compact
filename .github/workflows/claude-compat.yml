# Weekly check against the newest Claude Code, so a change in its flags or its
# module rules shows up before users see it. A red run here means "look", not "revert".
name: claude-compat

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest-claude-code:
    name: newest Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm install --global "@anthropic-ai/claude-code@latest"
        env:
          DISABLE_AUTOUPDATER: "1"
      - run: claude --version
      - run: claude plugin validate plugin --strict
      - run: claude plugin test plugin
      - name: Restart launcher flag table against claude --help
        run: tools/launcher-flags
