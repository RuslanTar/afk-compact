version: 2
updates:
  # The workflows pin each action to a commit; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Propose a release only once it is 7 days old.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
  # TypeScript is the only npm dependency, and it is for tools/typecheck only (never shipped).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Propose a release only once it is 7 days old, as .npmrc's min-release-age does for npm.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
